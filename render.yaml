# Prepared for review. Creating this Blueprint provisions a PAID service and disk.
# This file assumes the LOTSPLIT directory is the repository root.
services:
  - type: web
    name: lotsplit
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: lotsplit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: sandbox
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /var/data
      # APP_ORIGIN defaults to Render's RENDER_EXTERNAL_URL.
      # Add APP_ORIGIN explicitly when using a custom public origin.
      - key: ORGANIZER_ACCESS_TOKEN
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: NEBIUS_TEXT_MODEL
        value: Qwen/Qwen3-30B-A3B-Instruct-2507
      - key: NEBIUS_VISION_MODEL
        value: nvidia/Nemotron-3.5-Super-VL
